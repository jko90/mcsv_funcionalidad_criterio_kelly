<app-encabezado [titulo]="titulo"></app-encabezado>

<ion-content>
  <ion-grid fixed>
    <h5 class="subtitulo enunciado-negro">GESTIÓN DE CUENTAS</h5>

    <ion-row>
      <ion-col size="12" class="ion-text-center">
        <ion-button color="success" id="crearCuentaBtn" (click)="crearCuenta()"
          >Crear Cuenta</ion-button
        >
        <ion-button color="primary" (click)="generarPDF()"
          >Reporte PDF</ion-button
        >
      </ion-col>
    </ion-row>

    <ion-grid class="tabla-personalizada">
      <ion-row>
        <ion-col size="4" class="ion-text-center"
          ><strong>Cuenta</strong></ion-col
        >
        <ion-col size="4" class="ion-text-center"
          ><strong>Capital</strong></ion-col
        >
        <ion-col size="4" class="ion-text-center"
          ><strong>Acción</strong></ion-col
        >
      </ion-row>
      @for (cuenta of listaCuentas(); track cuenta.cue_idCuentas) {
      <ion-row>
        <ion-col size="4" class="ion-text-left">
          {{ cuenta.cue_nombre }}
        </ion-col>
        <ion-col size="4" class="ion-text-center">
          <div>{{ cuenta.valor_cuenta | currency:'USD':'symbol':'1.2-2' }}</div>
          <div class="ion-text-center acciones-cuenta">
            <ion-button
              fill="clear"
              color="success"
              size="small"
              (click)="abrirModalCapital(cuenta, 'aumentar')"
            >
              <ion-icon
                name="add-circle-outline"
                style="font-size: 2rem"
              ></ion-icon>
            </ion-button>
            <ion-button
              fill="clear"
              color="warning"
              size="small"
              (click)="abrirModalCapital(cuenta, 'reducir')"
            >
              <ion-icon
                name="remove-circle-outline"
                style="font-size: 2rem"
              ></ion-icon>
            </ion-button>
          </div>
        </ion-col>

        <ion-col size="4" class="ion-text-center acciones-cuenta">
          <ion-button
            fill="clear"
            color="primary"
            size="small"
            (click)="actualizarCuenta(cuenta)"
          >
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
          <ion-button
            fill="clear"
            color="danger"
            size="small"
            (click)="eliminarCuenta(cuenta)"
          >
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
      }
    </ion-grid>
  </ion-grid>
  <app-alerta-limite-plan
    [abierta]="mostrarModalPlan()"
    [mensaje]="mensajeTopeCuentas()"
    (cerrado)="cerrarModalPlan()"
    (verPlanes)="alVerPlanes()"
  />
  <app-alerta-ck
    [abierta]="alertaActiva() !== null"
    [titulo]="textosAlertaActiva().titulo"
    [mensaje]="textosAlertaActiva().mensaje || null"
    [textoConfirmar]="textosAlertaActiva().textoConfirmar"
    [textoCancelar]="textoCancelar"
    [tipo]="tipoAlertaActiva()"
    [campos]="camposAlertaActiva()"
    [validador]="validarAlertaActiva"
    (confirmada)="alConfirmarAlerta($event)"
    (cancelada)="alDescartarAlerta()"
  />
</ion-content>
