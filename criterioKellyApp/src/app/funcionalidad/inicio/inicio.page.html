<!-- En inicio.page.html -->
<app-encabezado [titulo]="titulo"></app-encabezado>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="refrescarPantalla($event)">
    <ion-refresher-content refreshingSpinner="circles"></ion-refresher-content>
  </ion-refresher>

  <app-aviso-plan
    [textoTiempo]="planVigenteStore.textoTiempoRestante()"
    [aviso]="planVigenteStore.aviso()"
    [tituloPendiente]="planVigenteStore.tituloPendiente()"
    [mensajePendiente]="planVigenteStore.mensajePendiente()"
    [mensajeProgramado]="planVigenteStore.mensajeProgramado()"
    [puedeVerPlanes]="planVigenteStore.puedeVerPlanes()"
    (entendido)="planVigenteStore.marcarAvisoLeido()"
    [cancelado]="planVigenteStore.estaCancelado()"
    [fechaCorte]="planVigenteStore.fechaTerminoPlan()"
    [puedeCancelar]="planVigenteStore.puedeCancelar()"
    [puedeSubirComprobante]="planVigenteStore.puedeSubirComprobante()"
    [puedeVerEstadoPago]="planVigenteStore.puedeVerEstadoPago()"
    [puedePagarAnticipado]="planVigenteStore.puedePagarAnticipado()"
    (comprobanteSolicitado)="alSolicitarComprobante()"
    (planesSolicitados)="alSolicitarPlanes()"
    (cancelar)="alSolicitarCancelarPlan()"
  />

  <app-aviso-bloqueo
    [bloqueo]="planVigenteStore.bloqueoVisible()"
    [texto]="planVigenteStore.textoBloqueo()"
    [planes]="planesParaElegir()"
    [estaCargando]="estaProcesando()"
    (elegirPlan)="alElegirPlan($event)"
    (cerrar)="alCerrarBloqueo()"
  />

  <app-alerta-ck
    [abierta]="avisoPendienteAbierto()"
    [titulo]="tituloConflicto"
    [mensaje]="avisoConflictoPlan()"
    tipo="informativa"
    (confirmada)="alCerrarAvisoPendiente()"
    (cancelada)="alCerrarAvisoPendiente()"
  />

  <app-alerta-ck
    [abierta]="cancelarPlanPendiente()"
    [titulo]="alertaCancelarPlan.titulo"
    [mensaje]="mensajeCancelarPlan()"
    [textoConfirmar]="alertaCancelarPlan.textoConfirmar"
    tipo="destructiva"
    (confirmada)="alConfirmarCancelarPlan()"
    (cancelada)="alDescartarCancelarPlan()"
  />

  <app-alerta-ck
    [abierta]="planAConfirmar() !== null"
    [titulo]="tituloConfirmarPlan"
    [mensaje]="mensajeConfirmarPlan()"
    tipo="confirmacion"
    (confirmada)="alConfirmarElegirPlan()"
    (cancelada)="alCancelarElegirPlan()"
  />

  <ion-list>
    @for (grupo of gruposMenu(); track $index) {
    <ion-list>
      @for (menu of grupo; track $index) {
      <ion-item
        detail-icon="caret-forward-outline"
        [routerLink]="menu.redirectTo"
        detail
      >
        <ion-icon slot="start" [name]="menu.icon"></ion-icon>
        <ion-label> {{ menu.name }} </ion-label>
      </ion-item>
      }
    </ion-list>
    @if (!$last) {
    <br />
    } }
  </ion-list>
</ion-content>
