<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelarCambio()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>{{ titulo() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirmarCambio()">Aceptar</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar (ionInput)="parametroBusqueda($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  <ion-list id="modal-list" [inset]="true">
    <ion-radio-group
      [ngModel]="divisaProvisional()"
      (ngModelChange)="divisaProvisional.set($event)"
    >
      @for (divisa of listaFiltrada(); track divisa.value) {
        <ion-item (click)="divisaProvisional.set(divisa)">
          <ion-label>{{ divisa.text }}</ion-label>
          <ion-radio slot="end" [value]="divisa"></ion-radio>
        </ion-item>
      }
    </ion-radio-group>
  </ion-list>
</ion-content>
