<div class="filtro-fechas">
  <ion-item button detail="false" id="abrir-fecha-desde" lines="full">
    <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
    <ion-label>
      <p>Desde</p>
      <h3>{{ desde() ?? 'Sin límite' }}</h3>
    </ion-label>
  </ion-item>
  <ion-item button detail="false" id="abrir-fecha-hasta" lines="full">
    <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
    <ion-label>
      <p>Hasta</p>
      <h3>{{ hasta() }}</h3>
    </ion-label>
  </ion-item>

  @if (textoAviso(); as aviso) {
    <ion-note class="aviso-filtro">{{ aviso }}</ion-note>
  }

  <ion-modal #modalDesde trigger="abrir-fecha-desde" class="modal-fecha">
    <ng-template>
      <ion-datetime
        presentation="date"
        [value]="desde() ?? hasta()"
        [min]="fechaMinima() ?? undefined"
        [max]="fechaMaxima()"
        (ionChange)="alElegirDesde($event.detail.value); modalDesde.dismiss()"
      ></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal #modalHasta trigger="abrir-fecha-hasta" class="modal-fecha">
    <ng-template>
      <ion-datetime
        presentation="date"
        [value]="hasta()"
        [min]="fechaMinima() ?? undefined"
        [max]="fechaMaxima()"
        (ionChange)="alElegirHasta($event.detail.value); modalHasta.dismiss()"
      ></ion-datetime>
    </ng-template>
  </ion-modal>
</div>
