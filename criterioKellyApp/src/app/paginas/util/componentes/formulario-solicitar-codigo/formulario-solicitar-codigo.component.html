<form [formGroup]="formulario" (ngSubmit)="enviar()">
  <ion-item>
    <ion-label position="floating">Correo electrónico</ion-label>
    <ion-input type="email" formControlName="correo"></ion-input>
  </ion-item>
  @if (formulario.controls.correo.touched && formulario.controls.correo.invalid) {
    <ion-note color="danger">Ingrese un correo válido.</ion-note>
  }
  <ion-button expand="block" type="submit" [disabled]="estaCargando()">Enviar código</ion-button>
</form>
